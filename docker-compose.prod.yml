# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION — VPS deployment
#
# Usage on the VPS:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml logs -f app
#   docker compose -f docker-compose.prod.yml down        ← stops containers, data persists
#   docker compose -f docker-compose.prod.yml down -v     ← ⚠ DESTROYS postgres_data. Never run this on the VPS.
#
# postgres does NOT publish its port to the host — only `app` (and Caddy, if
# used) are reachable from outside the docker network. Reduces attack surface:
# nothing but this compose stack can ever open a connection to your database.
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: wokizi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: production
    container_name: wokizi_backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'   # only reachable on the VPS itself — put a reverse proxy in front for public access
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
    name: wokizi_postgres_data
